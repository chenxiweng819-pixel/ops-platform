- hosts: webs
  vars_files:
    - /root/vars/nginx.yml
  tasks:
    - name: Install Nginx Server
      yum:
        name: "{{ nginx_package }}"
        state: present

    - name: Create Nginx Web Root
      file:
        path: "{{ nginx_web_root }}"
        state: directory
        owner: www
        group: www
        mode: "0755"

    - name: Configure Nginx Main Config
      copy:
        content: |
          user www;
          worker_processes {{ nginx_worker_processes }};
          worker_rlimit_nofile {{ nginx_worker_rlimit_nofile }};

          error_log /var/log/nginx/error.log warn;
          pid /run/nginx.pid;

          events {
              worker_connections {{ nginx_worker_connections }};
              use epoll;
              multi_accept on;
          }

          http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;

              log_format main ' -  [] "" '
                              '  "" '
                              '"" ""';

              access_log /var/log/nginx/access.log main;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout {{ nginx_keepalive_timeout }};
              server_tokens off;
              client_max_body_size {{ nginx_client_max_body_size }};

              gzip on;
              gzip_comp_level 5;
              gzip_min_length 1k;
              gzip_vary on;
              gzip_proxied any;
              gzip_types
                  text/plain
                  text/css
                  text/xml
                  application/json
                  application/javascript
                  application/xml
                  application/xml+rss
                  image/svg+xml;

              include /etc/nginx/conf.d/*.conf;
          }
        dest: "{{ nginx_main_conf }}"
        backup: yes
      notify: Restart Nginx Server

    - name: Configure Nginx Server
      copy:
        content: |
          server {
              listen {{ nginx_listen_port }};
              server_name {{ nginx_server_name }};

              root {{ nginx_web_root }};
              index index.html index.htm;

              location / {
                  try_files  / =404;
              }
          }
        dest: "{{ nginx_conf_file }}"
        mode: "0644"
      notify: Restart Nginx Server

    - name: Create Test Index Page
      copy:
        content: "hello ansible nginx nfs\n"
        dest: "{{ nginx_web_root }}/index.html"
        owner: www
        group: www
        mode: "0644"

    - name: Configure Nginx File Limits
      copy:
        content: |
          www soft nofile 65535
          www hard nofile 65535
          root soft nofile 65535
          root hard nofile 65535
        dest: /etc/security/limits.d/nginx.conf

    - name: Configure Kernel Parameters
      copy:
        content: |
          net.core.somaxconn = 65535
          net.ipv4.tcp_max_syn_backlog = 65535
          net.ipv4.ip_local_port_range = 1024 65000
          net.ipv4.tcp_tw_reuse = 1
          fs.file-max = 1000000
        dest: /etc/sysctl.d/99-nginx.conf
      notify: Reload Sysctl

    - name: Start Nginx Server
      systemd:
        name: "{{ nginx_service }}"
        state: started
        enabled: yes

  handlers:
    - name: Restart Nginx Server
      systemd:
        name: "{{ nginx_service }}"
        state: restarted

    - name: Reload Sysctl
      shell: sysctl -p /etc/sysctl.d/99-nginx.conf
